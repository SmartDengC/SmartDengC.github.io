<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>知识库问答 — Deng Cong</title>
  <script>
    (() => {
      const isTheme = value => value === 'dark' || value === 'light';
      let theme = new URLSearchParams(location.search).get('theme');
      if (!isTheme(theme)) {
        try { theme = localStorage.getItem('dc-theme'); } catch (_) {}
      }
      document.documentElement.dataset.theme = isTheme(theme)
        ? theme
        : (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
    })();
  </script>
  <style>
    :root { --bg: #fff; --ink: #1d1d1f; --line: #e8e8ed; --blue: #0066cc; color-scheme: light; }
    :root[data-theme="dark"] { --bg: #08080a; --ink: #f5f5f7; --line: #2c2c30; --blue: #2997ff; color-scheme: dark; }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      height: 100vh;
      height: 100dvh;
      display: grid;
      grid-template-rows: auto minmax(0, 1fr);
      background: var(--bg);
      color: var(--ink);
      font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", "PingFang SC", "Microsoft YaHei", sans-serif;
    }
    header {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 0 16px;
      min-height: 60px;
      padding: 8px clamp(16px, 4vw, 40px);
      border-bottom: 1px solid var(--line);
    }
    h1 { margin: 0; font-size: 18px; font-weight: 650; }
    a { display: inline-flex; align-items: center; min-height: 44px; color: var(--blue); font-size: 14px; text-decoration: none; }
    a:hover { text-decoration: underline; }
    a:focus-visible { outline: 3px solid var(--blue); outline-offset: 4px; }
    main { min-height: 0; }
    iframe { display: block; width: 100%; height: 100%; border: 0; }
  </style>
</head>
<body>
  <header>
    <h1>知识库问答</h1>
    <a href="./index.html">返回首页</a>
  </header>
  <main>
    <iframe id="chatFrame" title="RAGFlow 知识库问答对话"
      data-src="http://localhost/chats/share?shared_id=cb2d269c08eb422cbef3a5e5030c0d8a&amp;from=chat&amp;auth=bb17c1605abb4b91afc43913cc568d66&amp;visible_avatar=1&amp;locale=zh-Hans&amp;streaming=true"></iframe>
  </main>
  <script>
    (() => {
      const frame = document.getElementById('chatFrame');
      const url = new URL(frame.dataset.src);
      url.searchParams.set('theme', document.documentElement.dataset.theme);
      frame.src = url.href;
    })();
  </script>
</body>
</html>
